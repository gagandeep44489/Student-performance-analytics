{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2>Register</h2>
    <form method="post">
      <div class="mb-3"><label class="form-label">Full Name</label><input name="name" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
      <div class="mb-3">
        <label class="form-label">Role</label>
        <select name="role" class="form-select">
          <option>Student</option>
          <option>Teacher</option>
          <option>Admin</option>
        </select>
      </div>
      <button class="btn btn-success" type="submit">Register</button>
    </form>
  </div>
</div>
{% endblock %}
