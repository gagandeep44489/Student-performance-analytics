{% extends 'base.html' %}
{% block content %}
<h2>Student Management</h2>
<form class="row g-2 mb-3" method="get">
  <div class="col-md-5"><input name="search" class="form-control" placeholder="Search name or roll number"></div>
  <div class="col-md-3"><input name="class" class="form-control" placeholder="Filter class"></div>
  <div class="col-md-2"><button class="btn btn-outline-primary w-100">Filter</button></div>
</form>

<div class="card mb-4"><div class="card-body">
  <h5>Add Student</h5>
  <form method="post" class="row g-2">
    <div class="col-md-3"><input name="name" class="form-control" placeholder="Name" required></div>
    <div class="col-md-2"><input name="roll_number" class="form-control" placeholder="Roll Number" required></div>
    <div class="col-md-2"><input name="student_class" class="form-control" placeholder="Class" required></div>
    <div class="col-md-2"><input name="section" class="form-control" placeholder="Section" required></div>
    <div class="col-md-2"><button class="btn btn-success w-100">Add</button></div>
  </form>
</div></div>

<table class="table table-striped table-bordered">
  <thead><tr><th>Name</th><th>Roll #</th><th>Class</th><th>Section</th><th>Add Marks</th><th>Report</th><th>Delete</th></tr></thead>
  <tbody>
  {% for st in students %}
    <tr>
      <td>{{ st.name }}</td><td>{{ st.roll_number }}</td><td>{{ st.student_class }}</td><td>{{ st.section }}</td>
      <td>
        <form method="post" action="{{ url_for('add_mark', student_id=st.id) }}" class="d-flex gap-1">
          <input name="subject" class="form-control form-control-sm" placeholder="Subject" required>
          <input name="marks" type="number" min="0" max="100" class="form-control form-control-sm" placeholder="Marks" required>
          <button class="btn btn-sm btn-primary">Save</button>
        </form>
      </td>
      <td><a class="btn btn-sm btn-outline-secondary" href="{{ url_for('report', student_id=st.id) }}">PDF</a></td>
      <td>
        <form method="post" action="{{ url_for('delete_student', student_id=st.id) }}">
          <button class="btn btn-sm btn-danger">Delete</button>
        </form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
